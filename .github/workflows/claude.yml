name: Claude

# Asistente a pedido: mencionar @claude en un issue, un PR o un comentario de revisión.
# Ejemplos: "@claude revisá" (otra revisión después de nuevos commits), "@claude
# implementá este issue" (abre una rama y un PR), "@claude ¿dónde se valida X?".
# Sólo responde a quien tiene permiso de escritura en el repo.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Deja ver el resultado del CI del PR para iterar sobre fallas.
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 60
            --append-system-prompt "Seguí CLAUDE.md y .github/claude/review-checklist.md. Trabajá en una rama propia y abrí PR; nunca empujes a main. No modifiques fórmulas ni umbrales clínicos sin que lo pida explícitamente una persona del equipo. Para correr comandos del repo: corepack enable && pnpm install."
